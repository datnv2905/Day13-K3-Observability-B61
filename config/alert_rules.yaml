# Alert phải mô tả TRIỆU CHỨNG người dùng cảm nhận, không mô tả nguyên nhân nội bộ.
#
# "latency_p95 > 3000ms" là triệu chứng — nó đúng dù thủ phạm là vector store chậm,
# LLM chậm hay prompt phình to. "vector_store_timeout > 0" là nguyên nhân: nó chỉ bắt
# được đúng một cách hỏng, và sẽ im lặng khi hệ thống hỏng theo cách khác.
#
# Ngưỡng lấy đúng từ config/slo.yaml. Mỗi alert đều có duration để không kêu vì một
# spike lẻ, và có owner cụ thể để không rơi vào cảnh "ai cũng thấy, không ai xử lý".
alerts:
  - name: high_latency_p95
    severity: warning
    condition: "latency_p95 > 3000ms for 5 minutes"
    type: symptom-based
    sli: latency_p95_ms
    owner: on-call-engineer
    runbook: docs/alerts.md#alert-1

  - name: elevated_error_rate
    severity: critical
    condition: "error_rate_pct > 2 for 3 minutes"
    type: symptom-based
    sli: error_rate_pct
    owner: on-call-engineer
    runbook: docs/alerts.md#alert-2

  - name: cost_budget_exceeded
    severity: warning
    condition: "daily_cost_usd > 2.5 (đánh giá mỗi giờ, cộng dồn theo ngày UTC)"
    type: symptom-based
    sli: daily_cost_usd
    owner: team-lead
    runbook: docs/alerts.md#alert-3
