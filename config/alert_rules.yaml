alerts:
  - name: high_api_latency
    severity: high
    condition: "latency_p95_ms > 3000 for 5m"
    type: symptom-based
    owner: observability-oncall
    runbook: docs/alerts.md#alert-1
  - name: elevated_api_error_rate
    severity: critical
    condition: "error_rate_pct > 2 for 5m"
    type: symptom-based
    owner: observability-oncall
    runbook: docs/alerts.md#alert-2
  - name: low_response_quality
    severity: warning
    condition: "quality_score_avg < 0.75 for 15m"
    type: symptom-based
    owner: ai-quality-oncall
    runbook: docs/alerts.md#alert-3
